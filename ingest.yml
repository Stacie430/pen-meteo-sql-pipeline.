name: Daily weather ingest

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:       # allows manual runs from the Actions tab

permissions:
  contents: write          # needed to commit the updated database

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("DBI", "RSQLite", "httr2"))'

      - name: Run ingestion
        run: Rscript ingest.R

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wetter.sqlite
          git diff --staged --quiet || git commit -m "Update weather data $(date -u +%F)"
          git push
